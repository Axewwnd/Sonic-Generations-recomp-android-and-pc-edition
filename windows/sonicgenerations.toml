# Sonic Generations (Windows) - Native Renderer Edition
# High-performance translation layer replacing Xenos emulation
# Flat `key = value` pairs (nested [tables] are joined with '_').

# --- Native Renderer (NEW - High Performance) -------------------------------
# This is the new native rendering path that bypasses Xenos emulation
# Based on Unleashed Recompiled and Skate3 native renderer
# Expected: 2-3x faster on mobile, 1.5-2x on desktop

# GPU plugin selection: "sonic" = native (default, fast), "xenos" = fallback (compat)
gpu_plugin = "sonic"

# Native renderer toggles
sonic_native_enable = true          # Enable native rendering (false = Xenos fallback)
sonic_gpu_native = true             # Use native path in GPU plugin
sonic_gpu_tile_opt = true           # Tile-based GPU optimizations (Adreno/Mali)
sonic_gpu_bindless = true           # Bindless textures for Hedgehog material system
sonic_native_aniso = 4              # Anisotropy 0-16 (4 is good balance)
sonic_native_res_scale = 1          # Resolution scale 1-4 (1 = native, 2 = 2x)
sonic_native_vsync = true           # VSync
sonic_native_async_shaders = true   # Async shader compilation (no stutter)

# Fallback to Xenos if native fails: set gpu_plugin = "xenos" and sonic_native_enable = false

# --- Input: keyboard plays out of the box (mnk driver) ----------------------
mnk_mode = true
# mnk_mouse = true        # mouse-look on right stick
# mnk_sensitivity = 1.0

# Default binds: WASD left stick, arrows right stick, Shift+arrows D-pad,
# Space A, L X, P Y, Q/E triggers, 1/3 shoulders, F/K stick clicks,
# Z/Tab back, X/Enter start.
# keybind_start = "Return"
# keybind_guide = "Escape"
# keybind_rstick_up = "I"

# --- Display ----------------------------------------------------------------
video_mode_width = 1280
video_mode_height = 720
resolution_scale = 1
vsync = true
present_letterbox = true

# --- Performance (optimized for native renderer) ----------------------------
readback_memexport = false
async_shader_compilation = true
anisotropic_override = 0
occlusion_query_enable = false
native_2x_msaa = false
gamma_render_target_as_unorm16 = false
log_level = "warning"

# --- Mobile optimizations (also help desktop) -------------------------------
clear_memory_page_state = false     # Don't re-upload guest memory every frame
ignore_thread_affinities = true     # Let OS schedule on big.LITTLE
ignore_thread_priorities = true
log_flush_interval = 5

# --- Speed hacks (native renderer already fast, these may not be needed) ----
# protect_zero = false   # skips address-0 protection; faster, can crash
# Extra: native renderer already bypasses EDRAM, so it's fast even without this
