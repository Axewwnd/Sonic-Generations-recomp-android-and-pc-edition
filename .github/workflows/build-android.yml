name: Build Sonic Generations Recomp Android APK

on:
  workflow_dispatch:
    inputs:
      xex_url:
        description: 'URL opcional para descargar default.xex (material con derechos de autor - usted es responsable de obtenerlo legalmente)'
        required: false
        default: ''
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      ANDROID_NDK_ROOT: /home/runner/android-sdk/ndk/27.2.12479018

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p $ANDROID_SDK_ROOT
          cd $ANDROID_SDK_ROOT
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          # Descomprimir a carpeta temporal para evitar conflicto de rutas
          unzip -q cmdline-tools.zip -d cmdline-tools-tmp
          # La estructura del zip es: cmdline-tools-tmp/cmdline-tools/bin/...
          mkdir -p cmdline-tools/latest
          mv cmdline-tools-tmp/cmdline-tools/* cmdline-tools/latest/
          rm -rf cmdline-tools-tmp cmdline-tools.zip
          ls cmdline-tools/latest/bin/

      - name: Accept Android SDK licenses
        run: |
          mkdir -p $ANDROID_SDK_ROOT/licenses
          echo "### Baseline Template for Android SDK licenses" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6df4131768b402" >> $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo "### Baseline Template for Android SDK preview licenses" > $ANDROID_SDK_ROOT/licenses/android-sdk-preview-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> $ANDROID_SDK_ROOT/licenses/android-sdk-preview-license
          echo "Licencias aceptadas"

      - name: Install SDK components
        run: |
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.31.1" \
            "ndk;27.2.12479018"

      - name: Export environment variables
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> $GITHUB_ENV
          echo "PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH" >> $GITHUB_ENV

      - name: Prepare rexglue-sdk and Android patches (android_sdk.sh)
        run: |
          chmod +x android_sdk.sh
          bash android_sdk.sh android/sdk/rexglue-sdk

      - name: Download default.xex (optional - provided by user)
        if: github.event.inputs.xex_url != ''
        run: |
          echo "Descargando default.xex desde URL proporcionada por el usuario..."
          mkdir -p port/_temp/input/dl
          curl -L -o port/_temp/input/dl/default.xex "${{ github.event.inputs.xex_url }}"
          ls -lh port/_temp/input/dl/default.xex
          echo "default.xex descargado en port/_temp/input/dl/default.xex"

      - name: Build APK (debug, no signing keystore required)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug \
            -PrexName=sonicgenerations \
            -PrexPortDir=$PWD/../port \
            -PrexSdkDir=$PWD/sdk/rexglue-sdk
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.parallel=false -Dorg.gradle.caching=true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonic-generations-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
