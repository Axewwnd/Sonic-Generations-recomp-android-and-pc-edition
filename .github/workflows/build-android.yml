name: Build Sonic Generations Recomp Android APK

on:
  workflow_dispatch:
    inputs:
      xex_url:
        description: 'URL para descargar default.xex (material con derechos de autor - usted es responsable de obtenerlo legalmente)'
        required: false
        default: 'https://github.com/Axewwnd/Sonic-Generations-recomp-android-and-pc-edition/releases/download/PC/Default.xex'
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      ANDROID_NDK_ROOT: /home/runner/android-sdk/ndk/27.2.12479018
      ANDROID_NDK_HOME: /home/runner/android-sdk/ndk/27.2.12479018

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradlew') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Show disk space before build
        run: df -h / /home

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p $ANDROID_SDK_ROOT
          cd $ANDROID_SDK_ROOT
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d cmdline-tools-tmp
          mkdir -p cmdline-tools/latest
          mv cmdline-tools-tmp/cmdline-tools/* cmdline-tools/latest/
          rm -rf cmdline-tools-tmp cmdline-tools.zip
          ls cmdline-tools/latest/bin/

      - name: Install SDK components (accept licenses automatically)
        run: |
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.31.1" \
            "ndk;27.2.12479018"

      - name: Export environment variables
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          echo "PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH" >> $GITHUB_ENV

      - name: Create local.properties for Gradle
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          # ndk.dir se deja fuera: Gradle lo toma de ANDROID_NDK_ROOT / ANDROID_NDK_HOME
          cat android/local.properties

      - name: Prepare rexglue-sdk and Android patches (android_sdk.sh)
        run: |
          chmod +x tools/android_sdk.sh
          bash tools/android_sdk.sh android/sdk/rexglue-sdk

      - name: Download default.xex (optional - provided by user)
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.xex_url }}" ]; then
            echo "Descargando default.xex desde URL proporcionada por el usuario..."
            mkdir -p port/_temp/input/dl
            curl -L -o port/_temp/input/dl/default.xex "${{ github.event.inputs.xex_url }}"
            ls -lh port/_temp/input/dl/default.xex
            echo "default.xex descargado en port/_temp/input/dl/default.xex"
          else
            echo "No se proporcionó URL de default.xex - se omite la descarga"
          fi

      - name: Build APK (debug, no signing keystore required)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug \
            -PrexName=sonicgenerations \
            -PrexPortDir=$PWD/../port \
            -PrexSdkDir=$PWD/sdk/rexglue-sdk
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.parallel=false -Dorg.gradle.caching=true

      - name: Verify APK was generated
        run: |
          if [ ! -f android/app/build/outputs/apk/debug/*.apk ]; then
            echo "ERROR: No se encontró ningún APK en android/app/build/outputs/apk/debug/"
            ls -la android/app/build/outputs/apk/debug/ 2>/dev/null || echo "Directorio de salida no existe"
            exit 1
          fi
          ls -lh android/app/build/outputs/apk/debug/*.apk

      - name: Show disk space after build
        run: df -h / /home

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonic-generations-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
